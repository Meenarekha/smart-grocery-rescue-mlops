name: Smart Grocery Rescue CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install DVC
        run: |
          pip install "dvc[http]"

      - name: Configure DVC credentials
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user Meena
          dvc remote modify origin --local password "${{ secrets.DAGSHUB_USER_TOKEN }}"

      - name: Verify DVC credentials
        shell: bash
        run: |
          if [ -n "${{ secrets.DAGSHUB_USER_TOKEN }}" ]; then
            echo "DAGSHUB_USER_TOKEN is configured."
          else
            echo "DAGSHUB_USER_TOKEN is NOT configured."
            exit 1
          fi

      - name: Pull DVC data
        run: |
          dvc pull -r origin

      - name: Run tests
        run: |
          pytest tests/ -v